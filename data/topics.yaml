agile: "Sprints, retro's en de eeuwige vraag: werkt Scrum nu echt, of doen we gewoon alsof?"
ai: "Van copiloten tot chatbots: hoe AI ons werk als developer verandert (en soms in de weg zit)."
architectuur: "Clean, hexagonaal of gewoon 'het werkt': hoe we software bouwen die overeind blijft."
