design: "Van UI tot merch: hoe wij, vaak voor het eerst, iets proberen te ontwerpen."
developer-life: "Het leven als developer buiten de code: routines, koffie en alles ertussen."
java: "Onze eerste liefde: taalfeatures, ecosystemen en waarom Java nog steeds leeft."
podcasting: "Achter de schermen van JCast: opnames, montage en lessen die we onderweg leren."
soft-skills: "Communicatie, feedback en samenwerken: de skills die geen enkele taal je leert."
