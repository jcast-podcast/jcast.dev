description: "Kevin Dubois werkt als principal software engineer bij Red Hat, waar hij nauw betrokken is bij de ontwikkeling van Quarkus en het LangChain4j-project. Zijn carrière begon op de universiteit in Rome, gevolgd door een avontuur in de Verenigde Staten waar hij via Cold Fusion en PHP uiteindelijk zijn thuis vond in de Java-wereld. Het is die vroege pijn van minder gestructureerde talen die hem tot op vandaag drijft om enterprise software op een solide, toekomstgerichte manier te bouwen. Kevin combineert diepgaande technische kennis met een oprechte passie voor de community: hij spreekt regelmatig op internationale conferenties en gelooft sterk in het delen van kennis als motor voor innovatie. Zijn enthousiasme voor cloud native Java en AI-integratie is aanstekelijk, en hij weet complexe concepten altijd te vertalen naar iets wat je morgen zelf kunt gaan uitproberen."
