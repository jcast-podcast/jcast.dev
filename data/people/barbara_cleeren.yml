description: "Barbara is capacity manager met meer dan twintig jaar ervaring in consultancy en technologie. 
Ze beweegt zich dagelijks op het snijvlak van mensen, projecten en realiteit, waar planning nooit losstaat van vertrouwen en welzijn. 
Met een scherpe blik voor signalen die vaak onzichtbaar blijven, bewaakt ze niet alleen de bezetting, maar ook de balans en duurzaamheid van teams. 
Barbara gelooft dat goed werk pas mogelijk is wanneer mensen zich gezien en gehoord voelen, en zet zich elke dag in om van resources opnieuw mensen te maken."
