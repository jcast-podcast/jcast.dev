description: "Benjamin Claes is quality and compliance engineer bij Sopra Steria, waar hij als domeinexpert IT-activiteiten begeleidt binnen de farmaceutische industrie, met een bijzondere focus op GXP compliance en computerized system validation. Hij is van opleiding chemicus en werkte eerder als chemisch analist en onderzoeker, waar hij onder andere machine learning inzette om de rijpheid van tomaten te meten met ultrasound imaging. Na een paar jaar in de chemie besloot hij de overstap te maken naar consultancy, en bij Sopra Steria vond hij naar eigen zeggen zijn roeping. Wat hem drijft is de combinatie van wetenschappelijke achtergrond, technische diepgang en de wetenschap dat zijn werk uiteindelijk bijdraagt aan de veiligheid van patiënten. Benjamin heeft bovendien een zachte plek voor JCast: hij luistert al mee vanaf de allereerste aflevering."
