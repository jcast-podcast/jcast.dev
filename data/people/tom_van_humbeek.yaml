description: "Tom Van Humbeek is product designer en werkt als consultant, onder andere bij CM waar hij momenteel als design system engineer aan de slag is. Hij combineert een sterke achtergrond in UX en UI met een brede interesse in hoe AI het designproces kan versnellen zonder in te boeten op kwaliteit en branding. Tom heeft ook ervaring met WCAG-toegankelijkheidsaudits en denkt bewust na over de ethische kant van de tools die hij inzet. Vroeger tekende hij veel en dat creatieve instinct is nooit helemaal weg: het staat gewoon wat lager op het pitje, zoals hij zelf grinnekend toegeeft."
