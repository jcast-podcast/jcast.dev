description: "Pieter Vincken is public cloud solution architect bij Cegeka, maar zijn liefde voor de cloud begon lang voor dat mooie functietitel. Rechtstreeks vanuit de universiteit belandde hij in een startup in Geel waar hij als enige technische medewerker al snel van AWS over Google Cloud naar alles wat er tussenin zit migreerde, gedreven door pure noodzaak en nieuwsgierigheid. Ondertussen werkt hij al meer dan tien jaar in de IT, met een focus op financiële diensten en biotech, en heeft hij de drie grote hyperscalers van binnenuit leren kennen. Bij Cegeka begeleidt hij vandaag klanten in alles wat met Azure en cloud te maken heeft, inclusief de eigen Cegeka-datacenters. Zijn grote droom is nog een Alibaba Cloud project meepikken, want dat is de enige grote cloud die hij nog niet met eigen handen heeft vastgehad."
