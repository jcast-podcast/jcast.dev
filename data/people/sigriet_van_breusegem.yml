description: "Sigriet is Senior Java Developer met een brede technische interesse en een natuurlijke nieuwsgierigheid naar alles wat met softwareontwikkeling te maken heeft. 
Ze combineert jaren ervaring in Java met een open blik op nieuwe technologieën, goede praktijken en manieren om code beter, leesbaarder en duurzamer te maken. 
Naast haar werk staat ze bekend om haar aanstekelijke enthousiasme voor haar vele hobby’s, van reizen tot creatieve projecten. 
Of het nu over architectuur, Pokémon Go of haken gaat, Sigriet praat met evenveel passie en energie. 
Voor haar draait het om blijven ontdekken, bijleren en plezier halen uit wat je doet, zowel achter het scherm als daarbuiten."
