name: "Björn De Craemer"
thumbnail: "/images/avatars/bjorn-avatar.png"
description: "Björn is een softwarearchitect met jaren ervaring. 
Maar code is voor hem slechts één kant van het verhaal: samenwerking, communicatie en soft skills zijn minstens zo belangrijk. 
Hij gelooft dat de beste developers niet alleen sterke technische kennis hebben, maar ook weten hoe ze mensen kunnen verbinden en teams kunnen laten groeien. 
Met zijn open blik en eerlijke aanpak deelt hij verhalen, inzichten en lessen die elke developer kunnen inspireren."
