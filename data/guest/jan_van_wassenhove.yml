name: "Jan Van Wassenhove"
thumbnail: "/images/avatars/jan-avatar.png"
description: "Jan Van Wassenhove is een ervaren developer, consultant en bevlogen spreker op conferenties zoals Techorama en Devoxx.
Hij staat bekend om zijn talent om complexe technologie helder, toegankelijk en met veel enthousiasme uit te leggen.
Of het nu gaat over software-architectuur, innovatie of de razendsnelle evolutie van AI: Jan brengt altijd nuance, menselijkheid en een frisse kijk mee."
