title = "JCast"
baseURL = "https://jcast.dev"
locale = "nl-BE"
defaultContentLanguage = "nl"
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
description = "De Nederlandstalige developer podcast over Java, software engineering, AI, tooling en developer life."
author = "Oumaima Zerouali, Viktor Van Steenweghen & Maarten Casteels"
keywords = "Nederlandstalige podcast, Belgische podcast, tech podcast, Java podcast, software development podcast, IT podcast België, developer podcast, programmeren, clean code, agile"
ogImage = "/images/logo-without-bg.png"

[params.podcast.platforms]
spotify = "https://open.spotify.com/show/3wfdG6IjCoJjfEx33MsM2W"
apple = "https://podcasts.apple.com/podcast/jcast/id1814550001"
amazon = "https://music.amazon.com/podcasts/bcbbf086-31fc-4cc5-b497-cbd9600ae48f"
itunes = "https://pca.st/itunes/1814550001"
podcastaddict = "https://podcastaddict.com/podcast/jcast/5881797"
deezer = "https://www.deezer.com/show/1001888441"
playerfm = "https://player.fm/series/series-3665934"

[params.assets]
customCSS = ["css/styles.css"]

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.asciidocExt]
    # Asciidoctor rendert alle .adoc content. Rouge geeft dezelfde
    # Pygments-klassen (.k, .s, ...) als Chroma, dus de bestaande CSS blijft werken.
    [markup.asciidocExt.attributes]
      source-highlighter = "rouge"
      rouge-css = "class"
      # Heading-id's zoals Goldmark ze maakte (#show-notes i.p.v. #_show_notes)
      idprefix = ""
      idseparator = "-"
      lang = "nl"

[taxonomies]
topic = "topics"

# Hugo roept asciidoctor aan als externe binary: expliciet toelaten.
[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^asciidoctor$']
