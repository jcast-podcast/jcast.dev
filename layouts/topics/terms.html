{{ define "main" }}
<section class="taxonomy-page taxonomy-page--terms">
    <h1 class="list-page-title">Topics</h1>
    <p class="blog-intro">Verken afleveringen en blogposts per onderwerp. We houden topics bewust beperkt en concreet.</p>

    <div class="topic-directory">
        {{ range .Data.Terms.Alphabetical }}
        <article class="topic-directory-card">
            <h2><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a></h2>
            <p>{{ .Count }} {{ if eq .Count 1 }}item{{ else }}items{{ end }}</p>
        </article>
        {{ end }}
    </div>
</section>
{{ end }}
