name: Auto release episode on first Monday of the month at 08:00 Europe/Brussels

on:
  schedule:
    - cron: '0 6-7 1-7 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release-episode
  cancel-in-progress: false

jobs:
  release-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Check first Monday 08:00 Europe/Brussels
        id: check-time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - bypassing date/time guard"
            echo "run_job=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR=$(TZ=Europe/Brussels date +%H)
          DOW=$(TZ=Europe/Brussels date +%u)   # 1 = Monday
          DOM=$(TZ=Europe/Brussels date +%d)   # 01-31, zero-padded

          # First Monday = the only Monday whose day-of-month is between 1 and 7.
          if [ "$((10#$HOUR))" -ge 8 ] && [ "$DOW" = "1" ] && [ "$DOM" -ge 1 ] && [ "$DOM" -le 7 ]; then
            echo "First Monday, 08:00 Europe/Brussels or later - running job"
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Monday after 08:00 Europe/Brussels (hour=$HOUR dow=$DOW dom=$DOM) - skipping"
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-time.outputs.run_job == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and merge episode branch
        if: steps.check-time.outputs.run_job == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --all

          # Accept feature/sXXeXX and feat/sXXeXX. S02E07 lived on feat/s02e07,
          # was never matched and the job stayed green without releasing.
          MATCHES=$(git branch -r | sed 's/^ *//' | grep -E '^origin/(feat|feature)/s[0-9]{2}e[0-9]{2}$' || true)
          COUNT=$(printf '%s' "$MATCHES" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            # Two cron runs can pass the guard (summer: 06 and 07 UTC) or a late
            # run can follow an earlier one; the second must not fail.
            if git log origin/trunk --since="12 hours ago" --grep='^Auto-release: Merge' --format=%h | grep -q .; then
              echo "Already released in the last 12 hours - nothing to do"
              exit 0
            fi
            echo "::error::No episode branch found matching (feat|feature)/sXXeXX"
            exit 1
          fi
          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple episode branches found, refusing to guess:"
            echo "$MATCHES"
            exit 1
          fi
          EPISODE_BRANCH="$MATCHES"

          BRANCH_NAME=${EPISODE_BRANCH#origin/}
          echo "Found episode branch: $BRANCH_NAME"

          git checkout trunk
          git merge "$EPISODE_BRANCH" --no-ff -m "Auto-release: Merge $BRANCH_NAME"
          git push origin trunk

          git push origin --delete "$BRANCH_NAME"

          echo "Successfully merged and deleted $BRANCH_NAME"
