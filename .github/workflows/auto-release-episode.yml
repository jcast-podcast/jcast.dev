name: Auto Release Episode

# GitHub Actions cron runs in UTC and cannot express "first Monday of the month"
# nor the Europe/Brussels timezone (which shifts between CET/UTC+1 and CEST/UTC+2
# for daylight saving time). To still fire at 08:00 Brussels local time on the
# first Monday of every month, we schedule a wider hourly window in UTC that
# always contains 08:00 Brussels (06:00 UTC in summer, 07:00 UTC in winter) on
# every possible date of the first Monday (days 1-7), then use a shell guard that
# re-evaluates the real date/time in Europe/Brussels and lets the job proceed
# only for the genuine first Monday at 08:00. Manual workflow_dispatch runs skip
# the guard and always execute.
on:
  schedule:
    - cron: '0 6-7 1-7 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Check first Monday 08:00 Europe/Brussels
        id: check-time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - bypassing date/time guard"
            echo "run_job=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR=$(TZ=Europe/Brussels date +%H)
          DOW=$(TZ=Europe/Brussels date +%u)   # 1 = Monday
          DOM=$(TZ=Europe/Brussels date +%d)   # 01-31, zero-padded

          # First Monday = the only Monday whose day-of-month is between 1 and 7.
          if [ "$HOUR" = "08" ] && [ "$DOW" = "1" ] && [ "$DOM" -ge 1 ] && [ "$DOM" -le 7 ]; then
            echo "First Monday 08:00 Europe/Brussels - running job"
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Monday 08:00 Europe/Brussels (hour=$HOUR dow=$DOW dom=$DOM) - skipping"
            echo "run_job=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-time.outputs.run_job == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and merge episode branch
        if: steps.check-time.outputs.run_job == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --all

          EPISODE_BRANCH=$(git branch -r | grep -E 'origin/feature/s[0-9]{2}e[0-9]{2}$' | head -n 1 | xargs)

          if [ -z "$EPISODE_BRANCH" ]; then
            echo "No episode branch found matching pattern feature/sXXeXX"
            exit 0
          fi

          BRANCH_NAME=${EPISODE_BRANCH#origin/}
          echo "Found episode branch: $BRANCH_NAME"

          git checkout trunk
          git merge "$EPISODE_BRANCH" --no-ff -m "Auto-release: Merge $BRANCH_NAME"
          git push origin trunk

          git push origin --delete "$BRANCH_NAME"

          echo "Successfully merged and deleted $BRANCH_NAME"
