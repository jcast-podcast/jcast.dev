name: Deploy Hugo Site to S3

on:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Hugo Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.152.2"
          extended: true

      - name: Build site with Hugo
        run: hugo --minify

      - name: Export legacy image paths
        run: sh scripts/export-legacy-images.sh

      - name: Verify image output
        run: sh scripts/verify-image-output.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Sync to S3
        run: aws s3 sync public/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete
