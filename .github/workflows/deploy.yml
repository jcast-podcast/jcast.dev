name: Deploy Hugo Site to S3

on:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Hugo Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build site with Hugo
        run: hugo --minify

      - name: Export legacy image paths
        run: sh scripts/export-legacy-images.sh

      - name: Verify image output
        run: sh scripts/verify-image-output.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Sync to S3
        run: aws s3 sync public/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete

      - name: Wait for deploy to propagate
        run: sleep 30

      - name: Submit URLs to IndexNow
        run: bash scripts/submit-indexnow.sh
